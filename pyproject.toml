[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailguard-expert"
version = "0.1.0"
description = "Local email risk assessment with source-bound evidence and portable agent skills"
requires-python = ">=3.12"
dependencies = [
  "imap-tools>=1.7,<2", "openai>=1.60,<3", "pydantic>=2.8,<3",
  "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "PyYAML>=6,<7"]

[project.scripts]
mailguard-expert = "mailguard.expert_cli:main"

[tool.setuptools]
packages = ["mailguard"]
include-package-data = false
